name: build-gramjs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y
      - run: npm i telegram@2.26.22 esbuild buffer process util events
      - run: node build.mjs
      - run: |
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add telegram.js
          git commit -m "build telegram.js"
          git push
