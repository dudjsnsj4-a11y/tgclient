<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEDF8"><link rel="manifest" href="manifest.json">
<title>TG Client</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{font-family:system-ui,sans-serif;background:#F7F8FF;color:#1B1B21}
.scr{display:none;height:100%;flex-direction:column}.scr.on{display:flex}
h1{font-size:36px;letter-spacing:-1px;margin:0}
.pad{padding:32px 24px;display:flex;flex-direction:column;gap:16px;flex:1;overflow:auto}
p{margin:0;color:#44464F;line-height:1.4}
input[type=text],input[type=tel],input[type=password],input:not([type]),input[inputmode]{background:#E9EAF4;border:0;border-radius:20px;padding:16px 18px;font-size:16px;width:100%;outline:0}
input:focus{box-shadow:0 0 0 2px #3B4FC4}
.btn{height:60px;border:0;border-radius:30px;background:#3B4FC4;color:#fff;font-size:18px;font-weight:800;width:100%}
.btn.t{background:#E1E3FF;color:#27379A}
.err{background:#FFD9E2;color:#5C1A35;border-radius:20px;padding:12px 16px;display:none}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#ECEDF8;border-radius:0 0 28px 28px}
.top>b{font-size:20px;flex:1}.top button{border:0;background:#E1E3FF;border-radius:20px;height:44px;padding:0 16px;font-weight:600}
.tt{flex:1;min-width:0}.tt b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;font-size:13px;color:#3B4FC4;font-weight:600;min-height:16px}
.list{flex:1;overflow:auto;padding:8px}
.row{display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:28px}
.row:active{background:#E1E3FF}
.av{width:52px;height:52px;border-radius:18px;background:#DCE4FF;color:#27379A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none;background-position:center;background-size:cover}
.av.sm{width:44px;height:44px;border-radius:16px;font-size:18px}
.m{flex:1;min-width:0}.m b{display:block}.m span{color:#5A5C66;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:#5A5C66}
.bd{background:#3B4FC4;color:#fff;border-radius:12px;min-width:24px;height:24px;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.b{max-width:82%;padding:10px 14px;border-radius:24px 24px 24px 8px;background:#E9EAF4;white-space:pre-wrap;word-break:break-word;align-self:flex-start}
.b.me{align-self:flex-end;background:#3B4FC4;color:#fff;border-radius:24px 24px 8px 24px}
.b .t{font-size:11px;opacity:.7;text-align:right;margin-top:2px}
.b.stk{background:none;padding:0}.b.stk .t{background:#0005;color:#fff;border-radius:10px;padding:1px 8px;display:inline-block;float:right;margin-top:-22px;position:relative;margin-right:6px;opacity:1}
.b.flash{animation:fl 1s}@keyframes fl{0%,60%{box-shadow:0 0 0 3px #FFB4C8}100%{box-shadow:none}}
.sn{font-size:13px;font-weight:800;color:#3B4FC4;margin-bottom:2px}
.b.me .sn{color:#DCE4FF}
.q{border-left:3px solid #3B4FC4;background:#3B4FC41A;border-radius:6px 12px 12px 6px;padding:4px 10px;margin-bottom:6px;font-size:13px}
.b.me .q{border-color:#fff;background:#FFFFFF2A}
.q b{display:block;font-size:12px}.q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;max-width:240px}
.sep{align-self:center;background:#E9EAF4;border-radius:12px;padding:5px 14px;font-size:13px;font-weight:600;color:#44464F;margin:8px 0 4px}
img.ph{display:block;max-width:100%;max-height:340px;border-radius:16px;margin-bottom:4px;background:#D5D7E6;min-width:120px;min-height:80px}
img.sk{display:block;width:150px;height:150px;object-fit:contain}
.fl{display:flex;align-items:center;gap:10px;padding:2px 0;min-width:170px}
.fl i{width:40px;height:40px;border-radius:14px;background:#3B4FC433;display:flex;align-items:center;justify-content:center;font-style:normal;flex:none}
.fl small{display:block;opacity:.75}
.rp{display:none;align-items:center;gap:10px;padding:8px 16px;background:#ECEDF8}.rp.on{display:flex}
.rp .rq{flex:1;min-width:0;border-left:3px solid #3B4FC4;padding-left:10px;font-size:13px}
.rp b{display:block;color:#3B4FC4}.rp span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp button{border:0;background:#E1E3FF;border-radius:50%;width:36px;height:36px;font-size:16px}
.bar{position:relative;display:flex;gap:10px;padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.bar input{border-radius:28px}
.bar .btn{width:56px;height:56px;border-radius:20px;font-size:22px;touch-action:manipulation;user-select:none;-webkit-user-select:none;flex:none}
.lpop{position:absolute;right:16px;bottom:84px;display:none;flex-direction:column;gap:10px;z-index:5}.lpop.on{display:flex}
.lpop button{width:52px;height:52px;border:0;border-radius:18px;background:#C9CFFF;color:#0B1A6B;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px #0003;animation:pop .18s ease-out}
.lpop button:nth-child(2){animation-delay:.05s;animation-fill-mode:backwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.sp{display:none;height:300px;background:#ECEDF8;border-radius:28px 28px 0 0;flex-direction:column}.sp.on{display:flex}
.stabs{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 6px;flex:none}
.stabs .chip{padding:8px 14px;border-radius:14px;background:#E1E3FF;color:#27379A;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.stabs .chip.on{background:#3B4FC4;color:#fff}
.sgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 10px calc(10px + env(safe-area-inset-bottom));align-content:start}
.sgrid>div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:30px}
.sgrid>div:active{background:#C9CFFF}.sgrid img{width:100%;height:100%;object-fit:contain}
.mn{position:fixed;display:none;background:#fff;border-radius:18px;box-shadow:0 6px 20px #0004;overflow:hidden;z-index:9}.mn.on{display:block}
.mn button{display:block;width:170px;text-align:left;border:0;background:none;padding:14px 18px;font-size:15px;font-weight:600}.mn button:active{background:#E1E3FF}
.ck{display:inline-flex;align-items:center;vertical-align:middle;margin-left:6px;padding:2px 7px;border-radius:10px;background:#FFFFFF26;line-height:0}
.ck.rd{background:#7FFFD433;color:#A6FFE4}
.ck svg{display:block}
.ckl{display:inline-flex;vertical-align:middle;margin-right:6px;color:#8A8C99;line-height:0}.ckl.rd{color:#3B4FC4}
.vw{position:fixed;inset:0;background:#000000F2;display:none;flex-direction:column;z-index:20}.vw.on{display:flex}
.vb{display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.vb button{width:48px;height:48px;border:0;border-radius:50%;background:#FFFFFF26;color:#fff;font-size:20px}
.vc{flex:1;overflow:auto;display:flex;color:#fff}
.vc .vimg{margin:auto;max-width:100%;max-height:100%;object-fit:contain}.vc .vimg.zoom{max-width:none;max-height:none;width:220%}
.vc video{margin:auto;max-width:100%;max-height:100%}.vc .vl{margin:auto;position:absolute;left:0;right:0;text-align:center;top:50%;pointer-events:none}
.av.big{width:120px;height:120px;border-radius:40px;font-size:48px}
.pn{font-size:26px;font-weight:800;text-align:center}
.pi{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pr{background:#E9EAF4;border-radius:20px;padding:12px 18px}.pr small{display:block;color:#3B4FC4;font-weight:600;font-size:12px}.pr div{font-size:16px;word-break:break-word;white-space:pre-wrap}
#ca,#chat .tt{cursor:pointer}
.dock{background:#ECEDF8;border-radius:28px 28px 0 0;padding-bottom:env(safe-area-inset-bottom)}
.dock .rp{margin:12px 12px 0;padding:8px 8px 8px 14px;border-radius:20px;background:#E1E3FF}
.dock .rp button{background:#F7F8FF}
.dock .bar{padding:12px;gap:10px;background:none}
.dock .bar input{background:#F7F8FF;border-radius:26px;height:52px;padding:0 20px}
.dock .bar .btn{width:52px;height:52px;border-radius:18px}
.dock .sp{background:none;border-radius:0}
.dock .sgrid{padding-bottom:10px}
</style></head><body>

<section class="scr" id="keys"><div class="pad">
<h1>Ключи Telegram API</h1>
<p>Получить свои: my.telegram.org → API development tools. Хранятся только на этом устройстве.</p>
<input id="aid" inputmode="numeric" placeholder="api_id"><input id="ahash" placeholder="api_hash">
<div class="err" id="e-keys"></div>
<button class="btn" id="b-keys">Продолжить</button></div></section>

<section class="scr" id="phone"><div class="pad">
<h1>Вход</h1><p>Номер телефона в международном формате.</p>
<input id="ph" type="tel" placeholder="+7…"><div class="err" id="e-phone"></div>
<button class="btn" id="b-phone">Получить код</button>
<button class="btn t" id="b-chkeys">Сменить ключи</button></div></section>

<section class="scr" id="code"><div class="pad">
<h1>Код</h1><p>Код пришёл в Telegram на другом устройстве или по SMS.</p>
<input id="cd" inputmode="numeric" placeholder="12345"><div class="err" id="e-code"></div>
<button class="btn" id="b-code">Войти</button></div></section>

<section class="scr" id="pw"><div class="pad">
<h1>Пароль</h1><p>Облачный пароль (двухфакторная защита).</p>
<input id="pwd" type="password" placeholder="Пароль"><button class="btn" id="b-pw">Войти</button></div></section>

<section class="scr" id="chats"><div class="top"><b>Чаты</b><button id="b-ref">Обновить</button><button id="b-out">Выйти</button></div>
<div class="list" id="dl"></div></section>

<section class="scr" id="chat"><div class="top"><button id="b-back">←</button><div class="av sm" id="ca"></div><div class="tt"><b id="ct"></b><span class="sub" id="cs"></span></div></div>
<div class="msgs" id="ms"></div>
<div class="dock"><div class="rp" id="rp"><div class="rq"><b id="rn"></b><span id="rtx"></span></div><button id="rx">✕</button></div>
<div class="bar" id="bar"><input id="tx" placeholder="Сообщение"><button class="btn" id="b-send">➤</button>
<div class="lpop" id="lp"><button id="p-file" aria-label="Файл"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.5l-8.5 8.5a5 5 0 01-7-7L14 5.5a3.5 3.5 0 015 5L10.5 19a2 2 0 01-3-3L15 8.5"/></svg></button>
<button id="p-stk" aria-label="Стикеры"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 14c1 1.5 2.5 2.2 4 2.2s3-.7 4-2.2M9 9.5h.01M15 9.5h.01"/></svg></button></div></div>
<div class="sp" id="sp"><div class="stabs" id="st"></div><div class="sgrid" id="sg"></div></div>
</div><input type="file" id="fi" multiple style="display:none"></section>
<section class="scr" id="prof"><div class="top"><button id="pb">←</button><b>Профиль</b></div><div class="pad" id="pc" style="align-items:center"></div></section>
<div class="vw" id="vw"><div class="vb"><button id="vx" aria-label="Закрыть">✕</button><button id="vd" aria-label="Скачать">⬇</button></div><div class="vc" id="vc"></div></div>
<div class="mn" id="mn"><button id="m-reply">Ответить</button><button id="m-copy">Копировать</button></div>

<script type="module">
const $=i=>document.getElementById(i), ls=localStorage;
const show=id=>{document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))};
const err=(id,t)=>{const e=$('e-'+id);if(e){e.textContent=t;e.style.display=t?'block':'none'}};
let client, LIB, waiters={};
const ask=id=>{show(id);return new Promise(r=>waiters[id]=r)};
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

async function boot(){
  const id=+ls.tg_id, hash=ls.tg_hash;
  if(!id||!hash) return show('keys');
  show('phone');err('phone','Подключение…');
  let last=null;
  for(const u of ['./telegram.js']){
    try{
      const mod=await import(u), d=mod.default||{}, pick=k=>mod[k]??d[k];
      const SS=pick('StringSession')||pick('sessions')?.StringSession, TC=pick('TelegramClient'), Api=pick('Api'), CF=pick('CustomFile'), Bf=pick('Buffer');
      if(!SS||!TC) throw new Error('нет нужных классов. mod: '+Object.keys(mod).slice(0,12).join(',')+' | default: '+Object.keys(d).slice(0,12).join(','));
      client=new TC(new SS(ls.tg_session||''),id,hash,{connectionRetries:3,useWSS:true,deviceModel:'Web',systemVersion:'Android',appVersion:'1.0',langCode:'ru',systemLangCode:'ru'});
      await client.connect(); LIB={Api,CF,Bf}; last=null; break;
    }catch(e){last=e;console.warn(u,e)}
  }
  if(last){ show('phone'); return err('phone','Не удалось подключиться: '+(last.message||last)); }
  err('phone','');
  try{
    await client.start({
      phoneNumber:()=>ask('phone').then(()=>$('ph').value.trim()),
      phoneCode:()=>ask('code').then(()=>$('cd').value.trim()),
      password:()=>ask('pw').then(()=>$('pwd').value),
      onError:e=>{show('phone');err('phone',e.message||String(e));return false}
    });
    ls.tg_session=client.session.save();
    startLive();
    loadChats();
  }catch(e){ show('phone'); err('phone','Ошибка: '+(e.message||e)); }
}
$('b-keys').onclick=()=>{
  const i=$('aid').value.trim(),h=$('ahash').value.trim();
  if(!/^\d+$/.test(i)||h.length<20) return err('keys','Проверь api_id (цифры) и api_hash (32 символа)');
  ls.tg_id=i;ls.tg_hash=h;boot();
};
$('b-chkeys').onclick=()=>{ls.clear();location.reload()};
$('b-phone').onclick=()=>waiters.phone&&waiters.phone();
$('b-code').onclick=()=>waiters.code&&waiters.code();
$('b-pw').onclick=()=>waiters.pw&&waiters.pw();
$('b-out').onclick=async()=>{try{await client.invoke(new LIB.Api.auth.LogOut())}catch{} ls.removeItem('tg_session');location.reload()};
$('b-ref').onclick=()=>loadChats();

let cur=null, busy=false, again=false, lastSig='', replyMsg=null, tick=0, kt=0, readMax=0, lastMarked=0;
const pad=n=>String(n).padStart(2,'0');
const hm=ts=>{const d=new Date(ts*1000);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dayDiff=ts=>{const d=new Date(ts*1000),n=new Date();return Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5)};
const dayLabel=ts=>{const x=dayDiff(ts),d=new Date(ts*1000);return x===0?'Сегодня':x===1?'Вчера':d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:d.getFullYear()===new Date().getFullYear()?undefined:'numeric'})};
const listTime=ts=>{const x=dayDiff(ts),d=new Date(ts*1000);return x===0?hm(ts):x===1?'Вчера':pad(d.getDate())+'.'+pad(d.getMonth()+1)};
const lastSeen=ts=>{const x=dayDiff(ts),d=new Date(ts*1000);return x===0?'был(а) в '+hm(ts):x===1?'был(а) вчера в '+hm(ts):'был(а) '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+' в '+hm(ts)};
function statusText(u){
  if(!u) return '';
  if(u.bot) return 'бот';
  const s=u.status; if(!s) return 'был(а) давно';
  switch(s.className){
    case 'UserStatusOnline': return 'в сети';
    case 'UserStatusOffline': return lastSeen(s.wasOnline);
    case 'UserStatusRecently': return 'был(а) недавно';
    case 'UserStatusLastWeek': return 'был(а) на этой неделе';
    case 'UserStatusLastMonth': return 'был(а) в этом месяце';
    default: return 'был(а) давно';
  }
}
const isOn=id=>$(id).classList.contains('on');
const CK1='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-label="Отправлено"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CK2='<svg width="22" height="16" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-label="Прочитано"><path d="M3 12.5l4.5 4.5L17 7.5"/><path d="M12 15.5l1.5 1.5L26 7.5"/></svg>';
const fmtSize=n=>n>1048576?(n/1048576).toFixed(1)+' МБ':Math.max(1,Math.round(n/1024))+' КБ';
const num=x=>Number(x&&x.toString?x.toString():x)||0;

/* ---------- очередь загрузок и кэш ---------- */
const q=[]; let active=0;
function pump(){while(active<3&&q.length){active++;q.shift()()}}
function enqueue(fn){return new Promise(res=>{q.push(()=>{fn().then(res,()=>res(null)).finally(()=>{active--;pump()})});pump()})}
const mcache=new Map();
const toURL=(buf,type)=>(buf&&buf.length)?URL.createObjectURL(new Blob([buf],{type})):null;

/* ---------- аватарки ---------- */
function paint(el,u){el.style.backgroundImage='url('+u+')';el.textContent=''}
async function setAvatar(el,entity,key){
  key='a'+key;
  if(mcache.has(key)){const u=mcache.get(key);if(u)paint(el,u);return}
  const u=await enqueue(async()=>toURL(await client.downloadProfilePhoto(entity,{isBig:false}),'image/jpeg'));
  mcache.set(key,u); if(u) paint(el,u);
}

/* ---------- виды сообщений ---------- */
function kind(m){
  if(!m||!m.media) return 'text';
  if(m.photo) return 'photo';
  const d=m.document; if(!d) return 'other';
  const at=d.attributes||[], has=n=>at.find(a=>a.className===n);
  if(has('DocumentAttributeSticker')) return 'sticker';
  const au=has('DocumentAttributeAudio'); if(au) return au.voice?'voice':'audio';
  const v=has('DocumentAttributeVideo'); if(v) return v.roundMessage?'vnote':'video';
  return 'file';
}
const stickerAlt=d=>((d.attributes||[]).find(a=>a.className==='DocumentAttributeSticker')||{}).alt||'🎴';
function labelOf(m){
  if(!m) return '';
  const k=kind(m), t=m.message||'';
  const L={photo:'Фото',sticker:(m.document?stickerAlt(m.document):'')+' Стикер',voice:'Голосовое',audio:'Аудио',video:'Видео',vnote:'Видеосообщение',file:'Файл',other:'Вложение'};
  return k==='text'?t:(t?L[k]+': '+t:L[k]);
}
async function docThumb(doc){
  const key='d'+doc.id; if(mcache.has(key)) return mcache.get(key);
  const st=doc.mimeType==='image/webp';
  const u=await enqueue(async()=>{
    const opt=st?{}:{thumb:(doc.thumbs&&doc.thumbs.length>1)?1:0};
    return toURL(await client.downloadMedia(doc,opt),st?'image/webp':'image/jpeg');
  });
  mcache.set(key,u); return u;
}
async function photoThumb(m,key){
  if(mcache.has(key)) return mcache.get(key);
  const u=await enqueue(async()=>{
    let buf; try{buf=await client.downloadMedia(m,{thumb:1})}catch{}
    if(!buf||!buf.length) buf=await client.downloadMedia(m,{});
    return toURL(buf,'image/jpeg');
  });
  mcache.set(key,u); return u;
}
function fillImgs(key,u){ if(u) document.querySelectorAll('img[data-k="'+key+'"]').forEach(i=>{i.src=u}) }

/* ---------- чаты ---------- */
async function loadChats(quiet){
  if(!quiet){show('chats');$('dl').textContent='Загрузка…';}
  try{
    const ds=await client.getDialogs({limit:40});
    const frag=document.createDocumentFragment();
    for(const d of ds){
      const r=document.createElement('div');r.className='row';
      const t=d.title||'Без имени';
      r.innerHTML='<div class="av"></div><div class="m"><b></b><span></span></div><div class="rt"><div class="tm"></div></div>';
      const av=r.querySelector('.av');av.textContent=t[0].toUpperCase();setAvatar(av,d.entity,String(d.id));
      r.querySelector('b').textContent=t;
      {const lm=d.message,ro=(d.dialog&&d.dialog.readOutboxMaxId)||0,bc=d.isChannel&&!d.isGroup;
      const sp=r.querySelector('span');sp.textContent=labelOf(lm);
      if(lm&&lm.out&&!bc){const rd=d.isUser&&lm.id<=ro;const c=document.createElement('i');c.className='ckl'+(rd?' rd':'');c.innerHTML=rd?CK2:CK1;sp.prepend(c)}}
      r.querySelector('.tm').textContent=d.date?listTime(d.date):'';
      if(d.unreadCount){const b=document.createElement('div');b.className='bd';b.textContent=d.unreadCount;r.querySelector('.rt').append(b)}
      r.onclick=()=>openChat(d);frag.append(r);
    }
    $('dl').replaceChildren(frag);
  }catch(e){if(!quiet)$('dl').textContent='Ошибка: '+(e.message||e)}
}
async function refreshStatus(){
  if(!cur) return; const d=cur;
  if(d.isUser){
    let txt=statusText(d.entity);
    try{const r=await client.invoke(new LIB.Api.users.GetUsers({id:[d.inputEntity]}));txt=statusText(r[0])}catch{}
    if(cur===d) $('cs').textContent=txt;
  }else if(d.isGroup){const n=d.entity&&d.entity.participantsCount;$('cs').textContent=n?n+' участн.':'группа'}
  else $('cs').textContent='канал';
}

/* ---------- сообщения ---------- */
const rcache=new Map();
const senderName=m=>{try{const s=m.sender;return s?(s.firstName||s.title||''):''}catch{return ''}};
function snip(m){return (labelOf(m)||'').replace(/\s+/g,' ').slice(0,80)}
function buildMsg(m,d,byId,need){
  const k=kind(m);
  const b=document.createElement('div');
  b.className='b'+(m.out?' me':'')+(k==='sticker'?' stk':'');b.dataset.id=m.id;
  if(d.isGroup&&!m.out){const n=senderName(m);if(n){const e=document.createElement('div');e.className='sn';e.textContent=n;b.append(e)}}
  const rid=m.replyTo&&m.replyTo.replyToMsgId;
  if(rid){
    const key=String(d.id)+':'+rid;
    const rm=byId.get(rid)||rcache.get(key);
    const e=document.createElement('div');e.className='q';
    const n=document.createElement('b'),t=document.createElement('span');
    if(rm){n.textContent=rm.out?'Вы':(senderName(rm)||(d.isUser?d.title:'Сообщение'));t.textContent=snip(rm)||'…'}
    else{n.textContent='Ответ';t.textContent='…';if(!rcache.has(key))need.add(rid)}
    e.append(n,t);
    e.onclick=ev=>{ev.stopPropagation();const el=$('ms').querySelector('[data-id="'+rid+'"]');if(el){el.scrollIntoView({block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}};
    b.append(e);
  }
  if(k==='sticker'){
    const im=document.createElement('img');im.className='sk';im.alt=stickerAlt(m.document);const key='d'+m.document.id;im.dataset.k=key;
    if(mcache.get(key)) im.src=mcache.get(key); else docThumb(m.document).then(u=>fillImgs(key,u));
    b.append(im);
  }else if(k==='photo'){
    const im=document.createElement('img');im.className='ph';const key='p'+d.id+':'+m.id;im.dataset.k=key;im.onclick=ev=>{ev.stopPropagation();openPhoto(m,key)};
    if(mcache.get(key)) im.src=mcache.get(key); else photoThumb(m,key).then(u=>fillImgs(key,u));
    b.append(im);
  }else if(k!=='text'){
    const f=document.createElement('div');f.className='fl';
    const at=(m.document&&m.document.attributes)||[];
    const fn=at.find(a=>a.className==='DocumentAttributeFilename'),au=at.find(a=>a.className==='DocumentAttributeAudio'),vi=at.find(a=>a.className==='DocumentAttributeVideo');
    const ic={voice:'🎤',audio:'🎵',video:'🎬',vnote:'🎬',file:'📎',other:'📎'}[k];
    const dur=(au&&au.duration)||(vi&&vi.duration)||0;
    const nm=k==='voice'?'Голосовое':k==='vnote'?'Видеосообщение':k==='video'?'Видео':(fn?fn.fileName:'Файл');
    const sz=m.document?fmtSize(num(m.document.size)):'';
    f.innerHTML='<i></i><div><b></b><small></small></div>';
    f.querySelector('i').textContent=ic;f.querySelector('b').textContent=nm;
    f.querySelector('small').textContent=[dur?Math.floor(dur/60)+':'+pad(dur%60):'',sz].filter(Boolean).join(' · ');
    f.onclick=async ev=>{
      ev.stopPropagation();if(k==='video'||k==='vnote'){openVideo(m);return}const sm=f.querySelector('small'),old=sm.textContent;sm.textContent='Загрузка…';
      try{
        const buf=await client.downloadMedia(m,{});
        const mime=(m.document&&m.document.mimeType)||'application/octet-stream';
        const url=URL.createObjectURL(new Blob([buf],{type:mime}));
        if(k==='voice'||k==='audio'){new Audio(url).play()}
        else{const a=document.createElement('a');a.href=url;a.download=fn?fn.fileName:'file';document.body.append(a);a.click();a.remove()}
      }catch(e){sm.textContent='Ошибка загрузки';return}
      sm.textContent=old;
    };
    b.append(f);
  }
  if(m.message&&k!=='sticker'){const tx=document.createElement('div');tx.textContent=m.message;b.append(tx)}
  else if(k==='text'&&!m.message){const tx=document.createElement('div');tx.textContent='[не поддерживается]';b.append(tx)}
  const tm=document.createElement('div');tm.className='t';tm.textContent=hm(m.date)+(m.editDate?' · изм.':'');
  if(m.out&&!(d.isChannel&&!d.isGroup)){const rd=d.isUser&&m.id<=readMax;const ck=document.createElement('span');ck.className='ck'+(rd?' rd':'');ck.innerHTML=rd?CK2:CK1;tm.append(ck)}
  b.append(tm);
  b.onclick=ev=>showMenu(ev,m);
  return b;
}
async function loadMsgs(first){
  if(!cur) return;
  if(busy){again=true;return}
  busy=true;const d=cur;
  try{
    const [ms]=await Promise.all([client.getMessages(d.entity,{limit:50}),refreshRead()]);
    if(cur!==d) return;
    const inc=ms.find(m=>!m.out);
    if(inc&&inc.id>lastMarked&&!document.hidden&&isOn('chat')){lastMarked=inc.id;Promise.resolve(client.markAsRead(d.entity)).catch(()=>{})}
    const sig=ms.map(m=>m.id+':'+(m.editDate||0)).join(',')+'|'+rcache.size+'|'+readMax;
    if(!first&&sig===lastSig) return;
    lastSig=sig;
    const box=$('ms');
    const near=first||box.scrollHeight-box.scrollTop-box.clientHeight<150;
    const arr=[...ms].reverse(), byId=new Map(arr.map(m=>[m.id,m])), need=new Set();
    const frag=document.createDocumentFragment();
    let last=-1;
    for(const m of arr){
      const x=dayDiff(m.date);
      if(x!==last){last=x;const s=document.createElement('div');s.className='sep';s.textContent=dayLabel(m.date);frag.append(s)}
      frag.append(buildMsg(m,d,byId,need));
    }
    box.replaceChildren(frag);
    if(near) box.scrollTop=box.scrollHeight;
    if(need.size){
      const ids=[...need];ids.forEach(i=>rcache.set(String(d.id)+':'+i,null));
      client.getMessages(d.entity,{ids}).then(rs=>{
        rs.forEach((r,i)=>{if(r)rcache.set(String(d.id)+':'+r.id,r)});
        if(cur===d){lastSig='';loadMsgs()}
      }).catch(()=>{});
    }
  }catch(e){ if(first) $('ms').textContent='Ошибка: '+(e.message||e) }
  finally{busy=false;if(again){again=false;loadMsgs()}}
}
async function openChat(d){
  cur=d;lastSig='';readMax=0;lastMarked=0;setReply(null);hideSp();
  $('ct').textContent=d.title||'';$('cs').textContent='';
  const av=$('ca');av.style.backgroundImage='';av.textContent=(d.title||'?')[0].toUpperCase();setAvatar(av,d.entity,String(d.id));
  show('chat');$('ms').textContent='Загрузка…';
  refreshStatus();await loadMsgs(true);
}
$('b-back').onclick=()=>{cur=null;hideSp();loadChats()};

/* ---------- индикаторы прочтения ---------- */
async function refreshRead(){
  if(!cur||!cur.isUser) return;
  try{
    const r=await client.invoke(new LIB.Api.messages.GetPeerDialogs({peers:[new LIB.Api.InputDialogPeer({peer:cur.inputEntity})]}));
    const dd=r.dialogs&&r.dialogs[0]; if(dd) readMax=dd.readOutboxMaxId||0;
  }catch{}
}

/* ---------- просмотр медиа на весь экран ---------- */
let vurl=null,vname='file';
function openViewer(){$('vw').classList.add('on');$('vc').textContent=''}
function closeViewer(){$('vw').classList.remove('on');$('vc').textContent='';vurl=null}
function saveUrl(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove()}
$('vx').onclick=closeViewer;
$('vd').onclick=()=>{if(vurl)saveUrl(vurl,vname)};
function viewImg(u,name){
  const im=document.createElement('img');im.className='vimg';im.src=u;im.onclick=()=>im.classList.toggle('zoom');
  $('vc').append(im);vurl=u;vname=name;
}
async function openPhoto(m,key){
  openViewer();const vc=$('vc');
  const thumb=mcache.get(key),fk='f'+key;
  const im=document.createElement('img');im.className='vimg';if(thumb)im.src=thumb;im.onclick=()=>im.classList.toggle('zoom');vc.append(im);
  vurl=thumb||null;vname='photo.jpg';
  let url=mcache.get(fk);
  if(!url){
    const l=document.createElement('div');l.className='vl';l.textContent='Загрузка…';vc.append(l);
    try{url=toURL(await client.downloadMedia(m,{}),'image/jpeg');mcache.set(fk,url)}catch{}
    l.remove();
  }
  if(url&&$('vw').classList.contains('on')){im.src=url;vurl=url}
}
async function openVideo(m){
  openViewer();const vc=$('vc');
  const l=document.createElement('div');l.className='vl';l.textContent='Загрузка видео…';vc.append(l);
  try{
    const buf=await client.downloadMedia(m,{});
    if(!$('vw').classList.contains('on')) return;
    const url=URL.createObjectURL(new Blob([buf],{type:(m.document&&m.document.mimeType)||'video/mp4'}));
    l.remove();const v=document.createElement('video');v.src=url;v.controls=true;v.autoplay=true;v.playsInline=true;vc.append(v);vurl=url;vname='video.mp4';
  }catch(e){l.textContent='Ошибка: '+(e.message||e)}
}

/* ---------- профиль ---------- */
async function openProfile(){
  if(!cur) return; const d=cur,e=d.entity||{};
  show('prof');const pc=$('pc');pc.textContent='';
  const av=document.createElement('div');av.className='av big';av.textContent=(d.title||'?')[0].toUpperCase();pc.append(av);
  const h=document.createElement('div');h.className='pn';h.textContent=d.title||'';pc.append(h);
  const st=document.createElement('div');st.className='sub';st.style.textAlign='center';st.textContent=$('cs').textContent;pc.append(st);
  const box=document.createElement('div');box.className='pi';pc.append(box);
  const add=(l,v)=>{if(!v)return;const r=document.createElement('div');r.className='pr';r.innerHTML='<small></small><div></div>';r.firstChild.textContent=l;r.lastChild.textContent=v;r.onclick=()=>{try{navigator.clipboard.writeText(v)}catch{}};box.append(r)};
  const key='A'+String(d.id);
  (async()=>{
    let u=mcache.get(key);
    if(u===undefined){try{u=toURL(await client.downloadProfilePhoto(e,{isBig:true}),'image/jpeg')}catch{u=null}mcache.set(key,u)}
    if(u){paint(av,u);av.onclick=()=>{openViewer();viewImg(u,'avatar.jpg')}}
  })();
  try{
    const A=LIB.Api;
    if(d.isUser){
      const r=await client.invoke(new A.users.GetFullUser({id:d.inputEntity}));
      const u=(r.users&&r.users[0])||e;
      h.textContent=[u.firstName,u.lastName].filter(Boolean).join(' ')||d.title||'';
      st.textContent=statusText(u);
      add('Телефон',u.phone?'+'+u.phone:'');
      add('Имя пользователя',u.username?'@'+u.username:'');
      add('О себе',r.fullUser&&r.fullUser.about);
    }else if(e.className==='Channel'){
      const r=await client.invoke(new A.channels.GetFullChannel({channel:d.inputEntity}));
      const f=r.fullChat||{};
      st.textContent=(f.participantsCount?f.participantsCount+' участн.':(d.isGroup?'группа':'канал'));
      add('Имя пользователя',e.username?'@'+e.username:'');
      add('Описание',f.about);
    }else{
      const r=await client.invoke(new A.messages.GetFullChat({chatId:e.id}));
      const f=r.fullChat||{};
      const n=f.participants&&f.participants.participants&&f.participants.participants.length;
      st.textContent=n?n+' участн.':'группа';
      add('Описание',f.about);
    }
  }catch(err){add('Ошибка',err.message||String(err))}
}
$('ca').onclick=openProfile;
document.querySelector('#chat .tt').onclick=openProfile;
$('pb').onclick=()=>{show('chat');lastSig='';loadMsgs()};

/* ---------- ответ и меню сообщения ---------- */
function setReply(m){
  replyMsg=m;$('rp').classList.toggle('on',!!m);
  if(m){$('rn').textContent=m.out?'Вы':(senderName(m)||(cur&&cur.isUser?cur.title:'Сообщение'));$('rtx').textContent=snip(m)}
}
$('rx').onclick=()=>setReply(null);
let menuMsg=null;
function showMenu(ev,m){
  menuMsg=m;const mn=$('mn');mn.classList.add('on');
  mn.style.left=Math.max(8,Math.min(ev.clientX-60,innerWidth-186))+'px';
  mn.style.top=Math.max(70,ev.clientY-110)+'px';
  ev.stopPropagation();
}
$('m-reply').onclick=()=>{setReply(menuMsg);$('mn').classList.remove('on');$('tx').focus()};
$('m-copy').onclick=()=>{try{navigator.clipboard.writeText(menuMsg.message||'')}catch{}$('mn').classList.remove('on')};

/* ---------- отправка ---------- */
async function sendText(){
  const t=$('tx').value.trim();if(!t||!cur)return;
  const rep=replyMsg?replyMsg.id:undefined;$('tx').value='';setReply(null);
  try{await client.sendMessage(cur.entity,{message:t,replyTo:rep})}catch(e){$('cs').textContent='Не отправлено: '+(e.message||e)}
  lastSig='';loadMsgs();
}
async function sendFiles(files){
  if(!cur||!files.length) return;
  const cap=$('tx').value.trim(),rep=replyMsg?replyMsg.id:undefined;$('tx').value='';setReply(null);
  $('cs').textContent='Отправка файла…';
  for(const f of files){
    try{
      if(!LIB.CF||!LIB.Bf) throw new Error('нужно пересобрать telegram.js (запусти build-gramjs заново)');
      const file=new LIB.CF(f.name,f.size,'',LIB.Bf.from(await f.arrayBuffer()));
      await client.sendFile(cur.entity,{file,caption:cap||undefined,replyTo:rep,forceDocument:!/^image\//.test(f.type)});
    }
    catch(e){$('cs').textContent='Ошибка файла: '+(e.message||e);return}
  }
  refreshStatus();lastSig='';loadMsgs();
}
$('fi').onchange=e=>{const fs=[...e.target.files];e.target.value='';sendFiles(fs)};

/* долгое нажатие на кнопку отправки */
let lpT=0,lpFired=false;
const sb=$('b-send');
sb.addEventListener('pointerdown',()=>{lpFired=false;clearTimeout(lpT);lpT=setTimeout(()=>{lpFired=true;$('lp').classList.add('on');if(navigator.vibrate)navigator.vibrate(15)},450)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>sb.addEventListener(ev,()=>clearTimeout(lpT)));
sb.addEventListener('contextmenu',e=>e.preventDefault());
sb.onclick=()=>{if(lpFired){lpFired=false;return}sendText()};
$('p-file').onclick=()=>{$('lp').classList.remove('on');$('fi').click()};
$('p-stk').onclick=()=>{$('lp').classList.remove('on');openSp()};
$('tx').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendText()}});
document.addEventListener('click',e=>{
  if(!e.target.closest('#lp')&&e.target!==sb&&!sb.contains(e.target)) $('lp').classList.remove('on');
  if(!e.target.closest('#mn')) $('mn').classList.remove('on');
});

/* ---------- стикеры и паки ---------- */
let packs=null;const packCache=new Map();
const hideSp=()=>$('sp').classList.remove('on');
async function openSp(){
  $('sp').classList.add('on');
  if(packs) return;
  $('sg').textContent='Загрузка…';
  try{
    const r=await client.invoke(new LIB.Api.messages.GetAllStickers({hash:0}));
    packs=r.sets||[];
    if(!packs.length){$('sg').textContent='Нет добавленных паков. Добавь их в официальном Telegram.';return}
    const st=$('st');st.textContent='';
    packs.forEach((p,i)=>{const c=document.createElement('div');c.className='chip';c.textContent=p.title;c.onclick=()=>pickPack(i);st.append(c)});
    pickPack(0);
  }catch(e){packs=null;$('sg').textContent='Ошибка: '+(e.message||e)}
}
async function pickPack(i){
  [...$('st').children].forEach((c,j)=>c.classList.toggle('on',i===j));
  const p=packs[i],g=$('sg');g.textContent='Загрузка…';
  let docs=packCache.get(String(p.id));
  try{
    if(!docs){
      const r=await client.invoke(new LIB.Api.messages.GetStickerSet({stickerset:new LIB.Api.InputStickerSetID({id:p.id,accessHash:p.accessHash}),hash:0}));
      docs=r.documents||[];packCache.set(String(p.id),docs);
    }
  }catch(e){g.textContent='Ошибка: '+(e.message||e);return}
  g.textContent='';
  for(const doc of docs.slice(0,60)){
    const cell=document.createElement('div');cell.textContent=stickerAlt(doc);
    const key='d'+doc.id;
    const put=u=>{if(u&&cell.isConnected){const im=document.createElement('img');im.src=u;cell.textContent='';cell.append(im)}};
    if(mcache.get(key)) put(mcache.get(key)); else docThumb(doc).then(put);
    cell.onclick=async()=>{
      if(!cur) return;
      const rep=replyMsg?replyMsg.id:undefined;setReply(null);hideSp();
      try{await client.sendFile(cur.entity,{file:doc,replyTo:rep})}catch(e){$('cs').textContent='Ошибка: '+(e.message||e)}
      lastSig='';loadMsgs();
    };
    g.append(cell);
  }
}

/* ---------- обновления ---------- */
function kick(){
  clearTimeout(kt);
  kt=setTimeout(()=>{ if(isOn('chat')) loadMsgs(); else if(isOn('chats')) loadChats(true) },300);
}
function startLive(){
  try{
    client.addEventHandler(u=>{
      const n=u&&u.className||'';
      if(/Message|ReadHistory/.test(n)) kick();
      else if(n==='UpdateUserStatus'&&isOn('chat')) refreshStatus();
    });
  }catch(e){console.warn('live',e)}
  setInterval(()=>{
    if(document.hidden||!client) return;
    tick++;
    if(isOn('chat')){ loadMsgs(); if(tick%6===0) refreshStatus(); }
    else if(isOn('chats') && tick%3===0) loadChats(true);
  },5000);
}
boot();
</script></body></html>
